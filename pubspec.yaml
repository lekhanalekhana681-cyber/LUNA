name: luna
description: Women’s period‑tracking app with local‑first storage.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  intl: ^0.19.0
  sqflite: ^2.3.0
  sqlcipher_flutter_libs: ^0.1.0
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.0
  flutter_local_notifications: ^16.2.0
  timezone: ^0.9.3
  fl_chart: ^0.68.0
  csv: ^6.0.0
  pdf: ^5.0.0
  google_fonts: ^7.0.0
  flutter_svg: ^2.0.10
  local_auth: ^2.2.0
  # testing
  mockito: ^5.4.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

